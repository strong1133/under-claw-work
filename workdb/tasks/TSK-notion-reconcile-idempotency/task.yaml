  draft: |-
      P1-b 후속 정본 Task (ROUND 6b 잔여 P1 등록).

      배경: lib/core/notion_sync_adapter.dart 의
      reconcileAndAcknowledge(...) 는 다건 배치를 처리한다. 배치 중간에
      일부 항목이 실패하면 이미 적용된 항목과 acknowledge 상태가 부분적으로만
      진행되어, 재실행 시 중복 적용/누락 위험이 남는다.

      범위:
        - 배치 처리를 원자 단위로 정의: 전부 성공 또는 안전 롤백.
        - 재실행이 안전하도록 idempotency 키/커서(예: 항목별 처리표시)를 도입해
          이미 반영된 항목의 재적용을 no-op 로 만든다.
        - Git 이 단일 정본이라는 경계 하에서, 부분 실패 후 재적용이 canonical
          상태를 손상하지 않음을 보장한다.

      Acceptance criteria:
        1. 배치 중 임의 위치에서 실패를 주입해도 canonical/ack 상태가 일관되게
           남는다(부분 커밋으로 인한 손상 없음)를 단위테스트로 검증한다.
        2. 동일 배치 재실행이 idempotent(중복 적용 0, 누락 0)임을 테스트로 증명한다.
        3. 상태전이·immutable Event 규약 회귀 없음.
        4. flutter analyze 0 error / dart format clean / flutter test green /
           secret_scan pass 유지.
