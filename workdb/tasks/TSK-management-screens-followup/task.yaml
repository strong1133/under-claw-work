  draft: |-
      ROUND 4에서 요구4의 디자인 토큰(lib/ui/design_tokens.dart), 테마
      (lib/ui/app_theme.dart), 타이포그래피(lib/ui/typography.dart, D2Coding
      감지+monospace fallback), 그리고 Environment 관리 화면
      (lib/ui/environment_screen.dart) + golden(test/ui/goldens/*.png)까지 실제
      구현·검증했다. 이 Task는 남은 관리 화면을 같은 토큰/테마 위에서 구현한다.

      범위(모두 Worklog Core 서비스로만 데이터 접근, UI가 정본 직접편집 금지):
        1. Agent 관리 화면 — AgentRegistryService로 등록·조회·이름(별칭)편집·
           비활성화/활성화·Environment 재바인딩. (Core에 rename/setStatus/
           deactivate/activate/bindEnvironment 이미 존재.)
        2. Match 검수 화면 — MatchService로 제안 목록·승인/거부/교정(revoke),
           history/audit Event 표시. 색상 단독 금지(아이콘+텍스트 상태).
        3. Memory recall 조회 화면 — MemoryRecallService로 Domain/Milestone/Task
           스코프 recall 결과(current/superseded/provenance) 표시. 제한(restricted)
           자료는 RecallCapabilityIssuer 검증 없이는 노출 금지(기본 fail-closed).

      Acceptance criteria:
        1. 세 화면 모두 lib/ui 토큰/테마/StatusPill을 재사용하고 신규 하드코딩
           색·간격 없이 구현된다.
        2. 데이터 접근은 전적으로 Core 서비스 경유이며 UI는 canonical 파일을
           직접 쓰지 않는다.
        3. 상태 표현은 focus/hover/disabled/error/conflict를 보존하고 status를
           색상만으로 구분하지 않는다(아이콘+텍스트 병행).
        4. 각 화면에 widget test + golden test가 추가되고
           `flutter test --update-goldens` 후 일반 `flutter test`가 통과한다.
        5. flutter analyze 0 error / dart format clean / secret_scan pass 유지.
        6. 특정 OS/Agent/모델/Notion workspace id 하드코딩 없음.
