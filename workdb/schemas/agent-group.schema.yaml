$schema: "https://json-schema.org/draft/2020-12/schema"
title: AgentGroup
type: object
required: [schema_version, id, type, domain_id, title, status, roles]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^AGG-[A-Za-z0-9_-]+$"}
  type: {const: agent_group}
  domain_id: {type: string, pattern: "^DOM-[A-Za-z0-9_-]+$"}
  milestone_id: {type: string, pattern: "^MLS-[A-Za-z0-9_-]+$"}
  title: {type: string, minLength: 1}
  status: {type: string, enum: [active, archived]}
  roles:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, persona_id, independent]
      properties:
        name: {type: string, minLength: 1}
        persona_id: {type: string, pattern: "^PER-[A-Za-z0-9_-]+$"}
        independent: {type: boolean}
      additionalProperties: false
additionalProperties: true
