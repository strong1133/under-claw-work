$schema: "https://json-schema.org/draft/2020-12/schema"
title: RepositoryAuthPolicy
description: Public policy metadata only. Never store a password or verifier here.
type: object
required: [auth_policy_id, policy_version, provider_selection_status]
properties:
  auth_policy_id: {type: string}
  policy_version: {type: integer, minimum: 1}
  provider_selection_status: {const: pending_selection}
  verifier_provider: {type: "null"}
  verifier_locator: {type: "null"}
additionalProperties: false
