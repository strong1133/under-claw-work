$schema: "https://json-schema.org/draft/2020-12/schema"
title: ControlDisposition
type: object
required: [schema_version, id, type, request_id, disposition]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^EVT-[A-Za-z0-9_-]+$"}
  type: {const: control_disposition}
  request_id: {type: string, pattern: "^CTR-[A-Za-z0-9_-]+$"}
  disposition: {enum: [accepted, rejected, withdrawn, expired, superseded]}
additionalProperties: true
