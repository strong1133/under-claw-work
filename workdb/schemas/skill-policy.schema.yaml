$schema: "https://json-schema.org/draft/2020-12/schema"
title: SkillPolicy
type: object
required: [schema_version, id, type, domain_id, title, status, ordered_skill_ids]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^SKP-[A-Za-z0-9_-]+$"}
  type: {const: skill_policy}
  domain_id: {type: string, pattern: "^DOM-[A-Za-z0-9_-]+$"}
  milestone_id: {type: string, pattern: "^MLS-[A-Za-z0-9_-]+$"}
  title: {type: string, minLength: 1}
  status: {type: string, enum: [active, archived]}
  ordered_skill_ids:
    type: array
    items: {type: string, minLength: 1}
  per_round_skill_id: {type: string, minLength: 1}
additionalProperties: true
