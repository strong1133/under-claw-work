$schema: "https://json-schema.org/draft/2020-12/schema"
title: ChannelBinding
type: object
required: [schema_version, id, type, domain_id, title, status, platform, external_channel_id, agent_group_id]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^CHB-[A-Za-z0-9_-]+$"}
  type: {const: channel_binding}
  domain_id: {type: string, pattern: "^DOM-[A-Za-z0-9_-]+$"}
  milestone_id: {type: string, pattern: "^MLS-[A-Za-z0-9_-]+$"}
  title: {type: string, minLength: 1}
  status: {type: string, enum: [active, archived]}
  platform: {type: string, enum: [discord]}
  external_channel_id: {type: string, minLength: 1}
  agent_group_id: {type: string, pattern: "^AGG-[A-Za-z0-9_-]+$"}
additionalProperties: true
