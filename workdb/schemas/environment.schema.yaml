$schema: "https://json-schema.org/draft/2020-12/schema"
title: Environment
type: object
# `id` and `machine_key` are immutable identity. `alias` is a user-editable
# display name and must never be used as an identity key. `name` is retained
# only for backward-compatible reads of legacy records.
required:
  [schema_version, id, machine_key, alias, os, architecture, kind, capabilities, status]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^ENV-[A-Za-z0-9_-]+$"}
  type: {const: environment}
  # `MK-<hash>` for detected hosts; `legacy:ENV-<id>` for pre-split records
  # awaiting a one-time safe promotion.
  machine_key: {type: string, pattern: "^(MK-[A-Za-z0-9]+|legacy:ENV-[A-Za-z0-9_-]+)$"}
  alias: {type: string, minLength: 1}
  name: {type: string, minLength: 1}
  os: {type: string, minLength: 1}
  architecture: {type: string, minLength: 1}
  kind:
    enum: [desktop, server, headless, agent_runtime]
  capabilities: {type: array, items: {type: string}}
  status:
    enum: [active, inactive, retired]
  # Immutable audit of superseded machine keys (legacy promotion, relink).
  previous_machine_keys: {type: array, items: {type: string}}
  registered_at: {type: string}
  updated_at: {type: string}
additionalProperties: true
