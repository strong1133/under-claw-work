$schema: "https://json-schema.org/draft/2020-12/schema"
title: TaskCandidate
type: object
required: [schema_version, id, type, parent_task_id, title, draft, objective_ids, reason, depth, fingerprint, disposition]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^TGC-[A-Za-z0-9_-]+$"}
  type: {const: task_candidate}
  parent_task_id: {type: string, pattern: "^TSK-[A-Za-z0-9_-]+$"}
  title: {type: string, minLength: 1}
  draft: {type: string, minLength: 1}
  objective_ids: {type: array, minItems: 1, items: {type: string, pattern: "^OBJ-"}}
  knowledge_ids: {type: array, items: {type: string, pattern: "^KNW-"}}
  reference_ids: {type: array, items: {type: string, pattern: "^REF-"}}
  reason: {type: string, minLength: 1}
  depth: {type: integer, minimum: 1}
  fingerprint: {type: string, minLength: 64, maxLength: 64}
  disposition: {enum: [pending, accepted, rejected]}
  created_task_id: {type: [string, "null"]}
additionalProperties: false
