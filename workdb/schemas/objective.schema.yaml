$schema: "https://json-schema.org/draft/2020-12/schema"
title: Objective
type: object
required: [schema_version, id, type, scope, title, status]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^OBJ-[A-Za-z0-9_-]+$"}
  type: {const: objective}
  scope:
    type: object
    required: [domain_id]
    properties:
      domain_id: {type: string, pattern: "^DOM-[A-Za-z0-9_-]+$"}
      milestone_id: {type: [string, "null"]}
  title: {type: string, minLength: 1}
  status: {type: string, minLength: 1}
additionalProperties: true
