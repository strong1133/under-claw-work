$schema: "https://json-schema.org/draft/2020-12/schema"
title: Agent
type: object
required: [schema_version, id, type, environment_id, adapter, status]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^AGT-[A-Za-z0-9_-]+$"}
  type: {const: agent}
  environment_id: {type: string, pattern: "^ENV-[A-Za-z0-9_-]+$"}
  adapter: {type: string, minLength: 1}
  status: {type: string, minLength: 1}
additionalProperties: true
