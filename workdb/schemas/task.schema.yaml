$schema: "https://json-schema.org/draft/2020-12/schema"
title: WorkTask
type: object
required: [schema_version, id, title, status, prompt]
properties:
  # v1 omitted execution_scope. Readers migrate it to multiEnvironment
  # (fail-closed); v3 adds optional scope and explicit processing policy.
  schema_version: {enum: [1, 2, 3]}
  id: {type: string, pattern: "^TSK-[A-Za-z0-9_-]+$"}
  domain_id: {type: [string, "null"], pattern: "^DOM-[A-Za-z0-9_-]+$"}
  milestone_id: {type: [string, "null"], pattern: "^MLS-[A-Za-z0-9_-]+$"}
  title: {type: string, minLength: 1}
  status:
    enum: [draft, writing, metaRequested, metaReview, ready, claimed, running, paused, blocked, completed, cancelled]
  auto_derive_tasks: {type: boolean, default: false}
  auto_followup_tasks: {type: boolean, default: false}
  auto_accept_generated_tasks: {type: boolean, default: false}
  max_generation_depth: {type: integer, minimum: 0, maximum: 10, default: 2}
  target_environment: {type: string}
  target_environment_ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^ENV-[A-Za-z0-9_-]+$"}
  project_ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^PRJ-[A-Za-z0-9_-]+$"}
  model_selection_keys:
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^[A-Za-z0-9._-]+$"}
  processing_mode: {enum: [manual, automatic]}
  execution_scope: {enum: [singleMachine, multiEnvironment]}
  parent_task_id: {type: [string, "null"]}
  related_task_ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^TSK-[A-Za-z0-9_-]+$"}
  aligned_objective_ids: {type: array, items: {type: string, pattern: "^OBJ-"}}
  evidence_knowledge_ids: {type: array, items: {type: string, pattern: "^KNW-"}}
  source_reference_ids: {type: array, items: {type: string, pattern: "^REF-"}}
  generation_depth: {type: integer, minimum: 0}
  generation_fingerprint: {type: [string, "null"]}
  created_automatically: {type: boolean}
  legacy_ids: {type: array, items: {type: string}}
  prompt:
    type: object
    required: [draft_revision, meta_source_revision, approval, draft, meta]
    properties:
      draft_revision: {type: integer, minimum: 1}
      meta_source_revision: {type: integer, minimum: 0}
      meta_source_sha256: {type: string, pattern: "^$|^[0-9a-f]{64}$"}
      approval: {enum: [missing, stale, pending, approved]}
      draft: {type: string}
      meta: {type: string}
additionalProperties: false
