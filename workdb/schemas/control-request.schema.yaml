$schema: "https://json-schema.org/draft/2020-12/schema"
title: ImmutableControlRequest
type: object
required: [schema_version, id, type, operation_id, task_id, command, requested_at]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^CTR-[A-Za-z0-9_-]+$"}
  type: {const: control_request}
  operation_id: {type: string, pattern: "^OP-[A-Za-z0-9_-]+$"}
  task_id: {type: string, pattern: "^TSK-[A-Za-z0-9_-]+$"}
  run_id: {type: [string, "null"]}
  reserved_run_id: {type: [string, "null"]}
  command: {enum: [start, pause, resume, cancel, complete]}
  expected_task_revision: {type: integer, minimum: 1}
  target_environment_id: {type: string}
  requested_by: {type: object}
  requested_at: {type: string, format: date-time}
additionalProperties: true
