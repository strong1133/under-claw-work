$schema: "https://json-schema.org/draft/2020-12/schema"
title: Run
type: object
required: [schema_version, id, type, task_id, operation_id, status]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^RUN-[A-Za-z0-9_-]+$"}
  type: {const: run}
  task_id: {type: string, pattern: "^TSK-[A-Za-z0-9_-]+$"}
  operation_id: {type: string, pattern: "^OPR-[A-Za-z0-9_-]+$"}
  status: {type: string, minLength: 1}
additionalProperties: true
