$schema: "https://json-schema.org/draft/2020-12/schema"
title: Reference
type: object
required: [schema_version, id, type, title, reference_type, scope, locator]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^REF-[A-Za-z0-9_-]+$"}
  type: {const: reference}
  title: {type: string, minLength: 1}
  reference_type: {type: string, minLength: 1}
  scope: {type: object}
  locator:
    type: object
    required: [kind, value]
additionalProperties: true
