$schema: "https://json-schema.org/draft/2020-12/schema"
title: Match
type: object
# A many-to-many provenance-tracked link between a Knowledge/Reference item and
# a Domain/Milestone/Objective/Task, with an immutable review audit trail.
required:
  [schema_version, id, type, subject, target, match_mode, actor, review_state, history]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^MAT-[A-Za-z0-9_-]+$"}
  type: {const: match}
  subject:
    type: object
    required: [kind, id]
    properties:
      kind: {enum: [knowledge, reference]}
      id: {type: string, pattern: "^(KNW|REF)-[A-Za-z0-9_-]+$"}
  target:
    type: object
    required: [kind, id]
    properties:
      kind: {enum: [domain, milestone, objective, task]}
      id: {type: string, pattern: "^(DOM|MLS|OBJ|TSK)-[A-Za-z0-9_-]+$"}
  # How the candidate was produced.
  match_mode: {enum: [manual, agent, hybrid]}
  actor:
    type: object
    required: [actor_type, actor_id]
    properties:
      actor_type: {enum: [user, agent]}
      actor_id: {type: string, minLength: 1}
  # review_state MUST equal the `state` of the last (most recent) history
  # entry; the runtime validator (WorklogContractValidator) rejects any drift.
  review_state: {enum: [proposed, approved, rejected, revoked]}
  # Optional explainability signal for agent-produced candidates.
  confidence: {type: number, minimum: 0, maximum: 1}
  evidence: {type: string}
  source: {type: string}
  # Append-only audit: entries are never rewritten, only appended. actor_type
  # is required and enumerated so no transition is anonymous or role-spoofed.
  history:
    type: array
    minItems: 1
    items:
      type: object
      required: [state, action, actor_type, actor_id, at]
      properties:
        state: {enum: [proposed, approved, rejected, revoked]}
        action: {type: string}
        actor_type: {enum: [user, agent]}
        actor_id: {type: string, minLength: 1}
        at: {type: string}
        reason: {type: string}
        evidence: {type: string}
  # The subject/target above MUST also be mirrored into these canonical relation
  # fields (by subject.kind / target.kind) so the two representations can never
  # diverge; the runtime validator enforces the mirror.
  knowledge_ids: {type: array, items: {type: string}}
  reference_ids: {type: array, items: {type: string}}
  domain_id: {type: string}
  milestone_id: {type: string}
  objective_ids: {type: array, items: {type: string}}
  scope:
    type: object
    properties:
      task_ids: {type: array, items: {type: string}}
  created_at: {type: string}
  updated_at: {type: string}
additionalProperties: true
