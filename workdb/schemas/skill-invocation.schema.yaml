$schema: "https://json-schema.org/draft/2020-12/schema"
title: ImmutableSkillInvocation
type: object
required: [id, type, run_id, skill_id, sequence, bundle_version, status]
properties:
  id: {type: string, pattern: "^SKI-[A-Za-z0-9_-]+$"}
  type: {const: skill_invocation}
  run_id: {type: string}
  skill_id:
    enum:
      - under-claw-work-plan
      - under-claw-meta-prompt
      - under-claw-jarvis-plan-loop
      - under-claw-jarvis-plan
  round: {type: integer, minimum: 0}
  sequence: {type: integer, minimum: 1}
  bundle_version: {type: string}
  bundle_checksum: {type: string, pattern: "^[0-9a-f]{64}$"}
  evidence_kind: {enum: [host_reported, runtime_observed]}
  host_invocation_id: {type: string, minLength: 1}
  host_id: {type: string, minLength: 1}
  runner_id: {type: string, minLength: 1}
  environment_id: {type: string, pattern: "^ENV-[A-Za-z0-9_-]+$"}
  source_revision: {type: integer, minimum: 1}
  source_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  result_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  result_ref: {type: string, pattern: "^task:TSK-[A-Za-z0-9_-]+#meta@[0-9]+$"}
  started_at: {type: string, format: date-time}
  finished_at: {type: string, format: date-time}
  status: {enum: [started, completed, failed, cancelled]}
allOf:
  - if:
      properties:
        evidence_kind: {enum: [host_reported, runtime_observed]}
      required: [evidence_kind]
    then:
      required:
        [bundle_checksum, host_invocation_id, host_id, runner_id, source_revision,
         source_sha256, result_sha256, result_ref, started_at, finished_at]
additionalProperties: true
