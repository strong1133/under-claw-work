schema_version: 1
type: workspace_layout
layout_version: 1
# Canonical directories standardized by Under Claw Work.
# Their contents belong to the repository owner.
canonical_directories:
  - workdb/tasks
  - workdb/domains
  - workdb/milestones
  - workdb/projects
  - workdb/repositories
  - workdb/personas
  - workdb/agent-groups
  - workdb/channel-bindings
  - workdb/mcp-bindings
  - workdb/skill-policies
  - workdb/objectives
  - workdb/knowledge
  - workdb/references
  - workdb/events
  - workdb/claims
  - workdb/control-requests
  - workdb/control-dispositions
  - workdb/runs
  - workdb/invocations
  - workdb/matches
  - workdb/config
  - workdb/task-candidates
# Rebuildable host-local state; never committed.
host_local_directories:
  - .worklog
  - .worklog/migrations
