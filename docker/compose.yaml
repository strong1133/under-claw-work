# under-claw-work 데이터 저장소
#
# 실행:  docker/setup.sh          (접속정보 생성 + 기동 + DDL 적용까지)
# 수동:  docker compose --env-file ~/.config/under-claw-work/db.env -f docker/compose.yaml up -d
#
# 설정값은 전부 ~/.config/under-claw-work/db.env 에서 온다. 이 파일에 비밀번호를 적지 않는다.

name: under-claw-work

services:
  db:
    image: postgres:16-alpine
    container_name: under-claw-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-under_claw_work}
      POSTGRES_USER: ${POSTGRES_USER:-under_claw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?db.env 에 POSTGRES_PASSWORD 가 없다. docker/setup.sh 를 먼저 실행한다}
      # 볼륨 최상위에 직접 초기화하지 않고 하위 디렉터리를 쓴다.
      # 바인드 마운트 시 기존 파일/lost+found 때문에 initdb 가 실패하는 것을 막는다.
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      # 기본은 루프백에만 바인딩한다. 원격 노출은 의도적으로 POSTGRES_BIND 를 바꿔야 한다.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # 데이터 영속화 — 컨테이너를 지워도 남는다
      - ${UNDER_CLAW_DATA_DIR:?db.env 에 UNDER_CLAW_DATA_DIR 가 없다}:/var/lib/postgresql/data
      # 최초 기동 시 schema/*.sql 이 파일명 순서대로 자동 적용된다
      - ../schema:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # -h 127.0.0.1 을 반드시 준다. 초기화 중 임시 서버는 유닉스 소켓만 열기 때문에
      # 소켓 기준 검사는 초기화가 끝나기 전에도 통과해 버린다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-under_claw} -d ${POSTGRES_DB:-under_claw_work}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

    stop_grace_period: 30s
